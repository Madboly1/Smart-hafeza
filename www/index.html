<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b20"><title>BOUGA | بُؤجة</title>
<link rel="icon" href="assets/bouga-icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#071b20;--panel:rgba(20,49,54,.72);--panel2:#12343a;--line:rgba(190,231,224,.12);--text:#f1f7f4;--muted:#91aaa7;--mint:#9be2c5;--gold:#e9c78d;--danger:#ff827c;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 90% -10%,rgba(39,126,112,.28),transparent 42%),radial-gradient(ellipse at -10% 40%,rgba(35,92,101,.2),transparent 38%),var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{width:min(100%,620px);margin:auto;padding:0 18px}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:48px;height:48px;border-radius:16px;box-shadow:0 7px 22px #0005}.brand b{font-size:21px;letter-spacing:1.4px;display:block}.brand small{font-size:11px;color:var(--muted)}.avatar{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:var(--panel);display:grid;place-items:center;font-size:19px}
.eyebrow{font-size:12px;color:var(--mint);letter-spacing:.2px}.welcome{padding:15px 0 18px}.welcome h1{font-size:26px;line-height:1.35;margin:5px 0 4px;font-weight:750}.welcome p{margin:0;color:var(--muted);font-size:13px}
.search{height:54px;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 15px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}.search span{font-size:19px;color:var(--mint)}.search input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:14px}.search input::placeholder{color:#78918e}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.section-head h2{font-size:16px;margin:0}.section-head small{color:var(--muted);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px 12px;backdrop-filter:blur(18px)}.stat strong{display:block;font-size:21px;color:var(--mint)}.stat span{font-size:11px;color:var(--muted)}
.quick{display:flex;gap:9px;overflow:auto;padding:2px 0 5px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:14px;padding:9px 13px;color:#b9ceca;font-size:12px}.quick button.active{background:rgba(135,218,190,.15);border-color:rgba(155,226,197,.35);color:var(--mint)}
.categories{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px 0 5px}.categories::-webkit-scrollbar{display:none}.category{flex:0 0 auto;border:1px solid var(--line);border-radius:30px;padding:8px 14px;background:rgba(255,255,255,.045);font-size:12px;color:#b7cbc7}.category.active{background:var(--mint);color:#09251f;border-color:var(--mint);font-weight:700}
.link-list{display:grid;gap:11px}.link-card{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(135deg,rgba(26,63,67,.88),rgba(14,39,45,.82));box-shadow:0 9px 26px #0002;min-width:0;transition:transform .18s,border-color .18s}.link-card:active{transform:scale(.985)}.thumb{width:82px;height:78px;flex:0 0 82px;border-radius:13px;object-fit:cover;background:linear-gradient(145deg,#245c58,#102c34);display:grid;place-items:center;font-size:25px;color:var(--mint)}.link-info{min-width:0;flex:1}.link-info h3{font-size:13px;line-height:1.55;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.link-meta{font-size:10px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}.progress{height:4px;background:#ffffff16;border-radius:9px;margin-top:10px;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,#80d9b6,#e9c78d);border-radius:9px}.card-arrow{color:#88aaa2;font-size:18px;padding:0 3px}
.empty{padding:34px 18px;text-align:center;border:1px dashed rgba(155,226,197,.2);border-radius:20px;background:rgba(255,255,255,.025)}.empty .empty-icon{font-size:35px}.empty h3{font-size:15px;margin:10px 0 5px}.empty p{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.8}
.fab{position:fixed;z-index:8;bottom:calc(88px + env(safe-area-inset-bottom));left:max(20px,calc((100vw - 580px)/2));width:58px;height:58px;border:1px solid #c4f3df66;border-radius:20px;background:linear-gradient(145deg,#b1efd5,#64c6a5);color:#073027;font-size:29px;box-shadow:0 12px 30px #0006}
.bottom{position:fixed;z-index:7;bottom:0;left:0;right:0;padding:9px 18px calc(9px + env(safe-area-inset-bottom));background:rgba(5,22,26,.88);border-top:1px solid var(--line);backdrop-filter:blur(22px)}.nav{width:min(100%,580px);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{border:0;background:transparent;color:#78918e;padding:7px 3px;border-radius:13px;font-size:10px;display:grid;justify-items:center;gap:3px}.nav button span{font-size:19px}.nav button.active{color:var(--mint);background:rgba(155,226,197,.09)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(1,10,13,.72);backdrop-filter:blur(9px);display:none;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}.overlay.on{display:flex}.modal{width:min(100%,590px);max-height:92vh;overflow:auto;border:1px solid rgba(190,231,224,.17);border-radius:27px;background:linear-gradient(155deg,#173c40,#0b252b 70%);box-shadow:0 25px 80px #0009;padding:19px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal-head h2{font-size:18px;margin:0}.close{border:1px solid var(--line);background:#ffffff0b;border-radius:12px;width:37px;height:37px;font-size:20px}.field-label{display:block;font-size:12px;color:#b5cbc5;margin:13px 2px 5px}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#071d22a8;color:var(--text);outline:0;font-size:14px}.field:focus{border-color:#83d8b6}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--mint);color:#082820;font-weight:750;font-size:13px}.btn.secondary{background:#ffffff12;color:#d2e4df;border:1px solid var(--line)}.btn.danger{background:#8d3939;color:white}.actions .btn{flex:1}
.detail-title{font-size:18px;line-height:1.5;margin:12px 0}.detail-url{direction:ltr;text-align:left;word-break:break-all;color:#91aaa7;font-size:11px}.detail-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000;margin:12px 0}.reader{padding:13px;border-radius:16px;background:#071d22;line-height:1.9;font-size:13px;max-height:42vh;overflow:auto}.reader img{width:100%;border-radius:12px}.detail-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:16px 0 6px}.progress-range{width:100%;accent-color:#9be2c5}.warn{padding:12px;border-radius:15px;background:#72552a2b;border:1px solid #d9b36c33;color:#e8ca91;font-size:12px;margin-top:13px}
@media(min-width:600px){.overlay{align-items:center}.welcome h1{font-size:30px}.link-card{padding:13px}.thumb{width:92px;height:84px;flex-basis:92px}}
</style></head>
<body>
<main class="app">
<header class="top"><div class="brand"><img src="assets/bouga-icon.svg" alt=""><div><b>BOUGA</b><small>ذاكرتك الرقمية في مكان واحد</small></div></div><div class="avatar" aria-label="بؤجتك">✦</div></header>
<section class="welcome"><div class="eyebrow">مساحتك الخاصة للمحتوى</div><h1>خلي المهم دايمًا<br>في متناول إيدك.</h1><p>اجمع، رتّب، وارجع لكل حاجة وقت ما تحتاجها.</p></section>
<div class="search"><span>⌕</span><input id="q" placeholder="دوّر في بُؤجتك..." oninput="draw()"><span style="font-size:15px">⌘</span></div>
<section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>كل المحفوظات</span></div><div class="stat"><strong id="doneCount">0</strong><span>تمت مشاهدتها</span></div><div class="stat"><strong id="catCount">0</strong><span>مجموعاتك</span></div></section>
<div id="warn"></div>
<div class="section-head"><h2 id="sectionTitle">محتواك</h2><small id="resultCount">0 عنصر</small></div>
<div class="quick" id="quick"><button class="active" data-filter="all" onclick="setFilter('all',this)">الكل</button><button data-filter="فيديو" onclick="setFilter('فيديو',this)">▶ فيديو</button><button data-filter="مقال" onclick="setFilter('مقال',this)">▤ مقالات</button><button data-filter="بوست" onclick="setFilter('بوست',this)">▧ منشورات</button></div>
<div class="section-head"><h2>مجموعاتك</h2><small onclick="newCat()" style="color:var(--mint)">＋ مجموعة جديدة</small></div>
<div class="categories" id="chips"></div>
<div class="section-head"><h2 id="listTitle">أضيفت مؤخرًا</h2><small>الأحدث أولًا</small></div>
<div id="list" class="link-list"></div>
</main>
<button class="fab" onclick="openAdd()" aria-label="إضافة رابط">＋</button>
<nav class="bottom"><div class="nav"><button id="navHome" class="active" onclick="setView('home',this)"><span>⌂</span>الرئيسية</button><button id="navGroups" onclick="setView('groups',this)"><span>▦</span>المجموعات</button><button id="navDone" onclick="setView('done',this)"><span>✓</span>المكتمل</button></div></nav>
<div class="overlay" id="addOverlay" onclick="if(event.target===this)closeAll()"><section class="modal"><div class="modal-head"><h2>ضيف حاجة لبُؤجتك</h2><button class="close" onclick="closeAll()">×</button></div><label class="field-label">الرابط</label><input class="field" id="u" placeholder="https://..." dir="ltr" inputmode="url"><label class="field-label">المجموعة</label><select class="field" id="c"></select><div class="actions"><button class="btn" onclick="save()">حفظ في بُؤجة</button><button class="btn secondary" onclick="closeAll()">إلغاء</button></div></section></div>
<div class="overlay" id="detailOverlay" onclick="if(event.target===this)closeAll()"><section class="modal" id="det"></section></div>
<script>
const $=id=>document.getElementById(id),P=window.Capacitor&&Capacitor.Plugins||{};
let D;try{D=JSON.parse(localStorage.getItem('hl')||'{"links":[],"cats":["مونتاج","رياضة","أخرى"]}')}catch(e){D={links:[],cats:["مونتاج","رياضة","أخرى"]}}
if(!D||!Array.isArray(D.links)||!Array.isArray(D.cats))D={links:[],cats:["مونتاج","رياضة","أخرى"]};
D.links=D.links.map(l=>({...l,p:Number(l.p)||0,seen:l.seen||Date.now(),c:l.c||"أخرى",title:l.title||"",url:l.url||"",note:l.note||""}));D.cats=[...new Set([...D.cats,"أخرى"])];
let cur='الكل',last='أخرى',filter='all',view='home';
const st=()=>localStorage.setItem('hl',JSON.stringify(D));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yt=u=>(String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/)||[])[1];
function kind(u){if(yt(u)||/vimeo|tiktok|\/reel|\/watch|\/videos|fb\.watch/i.test(u))return'فيديو';if(/facebook|fb\.com|instagram|twitter|x\.com|threads/i.test(u))return'بوست';return'مقال'}
function icon(l){return l.k==='فيديو'?'▶':l.k==='بوست'?'▧':'▤'}
function validUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)}catch(e){return false}}
function embed(u){const y=yt(u);if(y)return'https://www.youtube.com/embed/'+y;let m;if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return'https://www.tiktok.com/embed/v2/'+m[1];if(/instagram\.com\/(p|reel|tv)\//.test(u))return u.split('?')[0].replace(/\/?$/,'/')+'embed';if(/facebook\.com|fb\.watch|fb\.com/.test(u))return/\/videos?\/|\/reel|\/watch|fb\.watch/.test(u)?'https://www.facebook.com/plugins/video.php?show_text=true&href='+encodeURIComponent(u):'https://www.facebook.com/plugins/post.php?href='+encodeURIComponent(u);return''}
async function meta(u){try{if(yt(u)){const j=await(await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u))).json();return{title:j.title,img:j.thumbnail_url}}const h=await(await fetch(u)).text(),g=p=>{const m=h.match(new RegExp('<meta[^>]+(?:property|name)=["\\']'+p+'["\\'][^>]*content=["\\']([^"\\']*)','i'));return m&&m[1]};return{title:g('og:title')||(h.match(/<title>([^<]*)/i)||[])[1],img:g('og:image')}}catch(e){return{}}}
function setFilter(f,el){filter=f;document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('active',b===el));draw()}
function setView(v,el){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===el));$('sectionTitle').textContent=v==='groups'?'مجموعاتك':v==='done'?'المكتمل':'محتواك';$('listTitle').textContent=v==='groups'?'كل المجموعات':v==='done'?'أنجزته بالفعل':'أضيفت مؤخرًا';draw();if(v==='groups')$('chips').scrollIntoView({behavior:'smooth',block:'nearest'})}
function draw(){const q=$('q').value.trim().toLowerCase(),done=D.links.filter(l=>l.p>=100).length;$('totalCount').textContent=D.links.length;$('doneCount').textContent=done;$('catCount').textContent=D.cats.length;
$('chips').innerHTML=['الكل',...D.cats].map(c=>'<button class="category '+(c===cur?'active':'')+'" onclick="cur='+JSON.stringify(c).replace(/</g,'\\u003c')+';draw()">'+esc(c)+'</button>').join('');
const old=D.links.filter(l=>l.p<100&&Date.now()-(l.seen||Date.now())>7*864e5);$('warn').innerHTML=old.length?'<div class="warn" onclick="show('+JSON.stringify(old[0].id)+')">⏳ عندك '+old.length+' عناصر لسه مرجعتلهاش من فترة. افتح أول عنصر وكمّل من مكانك.</div>':'';
let arr=D.links.filter(l=>(cur==='الكل'||l.c===cur)&&(filter==='all'||l.k===filter)&&(view!=='done'||l.p>=100)&&(view!=='groups'||true)&&(l.title+' '+l.url+' '+l.c).toLowerCase().includes(q));
if(view==='groups'){arr=[];$('list').innerHTML=D.cats.map(c=>'<button class="link-card" style="text-align:right" onclick="cur='+JSON.stringify(c)+';setView(\'home\',$(\'navHome\'))"><span class="thumb">▦</span><span class="link-info"><h3>'+esc(c)+'</h3><span class="link-meta">'+D.links.filter(l=>l.c===c).length+' عناصر محفوظة</span></span><span class="card-arrow">‹</span></button>').join('');$('resultCount').textContent=D.cats.length+' مجموعة';return}
arr.sort((a,b)=>(b.seen||0)-(a.seen||0));$('resultCount').textContent=arr.length+' عنصر';
$('list').innerHTML=arr.map(l=>'<article class="link-card" onclick="show('+JSON.stringify(l.id)+')">'+(l.img?'<img class="thumb" src="'+esc(l.img)+'" onerror="this.outerHTML=\'<div class=thumb>'+icon(l)+'</div>\'">':'<div class="thumb">'+icon(l)+'</div>')+'<div class="link-info"><h3>'+esc(l.title||l.url)+'</h3><div class="link-meta"><span>'+esc(l.c)+'</span><span>•</span><span>'+esc(l.k||'محتوى')+'</span><span>•</span><span>'+(l.p>=100?'مكتمل':l.p>0?l.p+'%':'جديد')+'</span></div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,l.p))+'%"></i></div></div><span class="card-arrow">‹</span></article>').join('')||'<div class="empty"><div class="empty-icon">🧺</div><h3>'+(view==='done'?'لسه مفيش حاجة خلصتها':'بُؤجتك لسه مستنياك')+'</h3><p>'+(view==='done'?'لما تخلص مشاهدة أو قراءة أي عنصر، هتلاقيه هنا.':'احفظ أول رابط يعجبك، وابدأ لمّ كل الحاجات المهمة في مكان واحد.')+'</p>'+(view==='done'?'':'<button class="btn" onclick="openAdd()">＋ أضف أول رابط</button>')+'</div>'}
function fillCats(){$('c').innerHTML=D.cats.map(c=>'<option '+(c===last?'selected':'')+'>'+esc(c)+'</option>').join('')}
function openAdd(u){fillCats();$('u').value=u||'';$('addOverlay').classList.add('on');setTimeout(()=>$('u').focus(),180)}
function closeAll(){$('addOverlay').classList.remove('on');$('detailOverlay').classList.remove('on');$('det').innerHTML=''}
function newCat(){const n=prompt('اسم المجموعة الجديدة:');if(n&&n.trim()&&!D.cats.includes(n.trim())){D.cats.push(n.trim());cur=n.trim();last=n.trim();st();fillCats();draw()}}
async function save(){let u=$('u').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;if(!validUrl(u)){alert('اكتب رابط صحيح يبدأ بـ https://');return}if(D.links.some(l=>l.url===u)){alert('الرابط ده محفوظ عندك بالفعل ❤️');return}last=$('c').value;const m=await meta(u);D.links.unshift({id:String(Date.now()),url:u,k:kind(u),c:last,title:m.title||'',img:m.img||(yt(u)?'https://i.ytimg.com/vi/'+yt(u)+'/hqdefault.jpg':''),p:0,note:'',seen:Date.now()});st();closeAll();filter='all';view='home';$('navHome').click();draw()}
function show(id){const l=D.links.find(x=>String(x.id)===String(id));if(!l)return;l.seen=Date.now();st();const e=embed(l.url);$('det').innerHTML='<div class="modal-head"><span class="eyebrow">تفاصيل من بُؤجتك</span><button class="close" onclick="closeAll()">×</button></div><h2 class="detail-title">'+esc(l.title||l.url)+'</h2><div class="detail-url">'+esc(l.url)+'</div>'+(e?'<iframe class="detail-frame" src="'+e+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>':'<div id="rd" class="reader" style="margin-top:14px">⏳ بنحاول نعرض المحتوى...</div>')+'<div class="detail-progress"><span>تقدمك</span><b id="pv">'+l.p+'%</b></div><input class="progress-range" type="range" min="0" max="100" step="5" value="'+l.p+'" oninput="$(\'pv\').textContent=this.value+\'%\';upd('+JSON.stringify(l.id)+',\'p\',+this.value)"><div class="actions"><button class="btn secondary" onclick="setP('+JSON.stringify(l.id)+',0)">لسه</button><button class="btn secondary" onclick="setP('+JSON.stringify(l.id)+',50)">في النص</button><button class="btn" onclick="setP('+JSON.stringify(l.id)+',100)">خلصت ✓</button></div><label class="field-label">ملاحظة أو مكان ما وقفت</label><input class="field" placeholder="مثلاً: الدقيقة 12" value="'+esc(l.note)+'" onchange="upd('+JSON.stringify(l.id)+',\'note\',this.value)"><label class="field-label">المجموعة</label><select class="field" onchange="upd('+JSON.stringify(l.id)+',\'c\',this.value);draw()">'+D.cats.map(c=>'<option '+(c===l.c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="actions"><button class="btn secondary" onclick="openIn('+JSON.stringify(l.id)+')">افتح الرابط ↗</button><button class="btn danger" onclick="removeLink('+JSON.stringify(l.id)+')">حذف</button></div>';$('detailOverlay').classList.add('on');if(!e)reader(l)}
async function reader(l){const b=$('rd');if(!b)return;try{const h=await(await fetch(l.url)).text(),d=new DOMParser().parseFromString(h,'text/html'),r=d.querySelector('article')||d.body,t=[...r.querySelectorAll('h1,h2,h3,p')].map(e=>e.textContent.trim()).filter(s=>s.length>30);b.innerHTML=(l.img?'<img src="'+esc(l.img)+'">':'')+(t.length?t.map(s=>'<p>'+esc(s)+'</p>').join(''):'الموقع مش بيسمح بعرض المحتوى هنا. افتح الرابط من الزر بالأسفل.')}catch(e){if(b)b.textContent='الموقع مش بيسمح بعرض المحتوى داخل التطبيق. افتح الرابط من الزر بالأسفل.'}}
function upd(id,k,v){const l=D.links.find(x=>String(x.id)===String(id));if(l){l[k]=v;st()}}
function setP(id,v){upd(id,'p',v);$('pv').textContent=v+'%';document.querySelector('.progress-range').value=v;draw()}
function removeLink(id){if(!confirm('متأكد إنك عايز تمسح العنصر ده؟'))return;D.links=D.links.filter(x=>String(x.id)!==String(id));st();closeAll();draw()}
function openIn(id){const l=D.links.find(x=>String(x.id)===String(id));if(!l)return;P.Browser?P.Browser.open({url:l.url}):window.open(l.url,'_blank')}
async function incoming(){try{const r=await P.SendIntent.checkSendIntentReceived(),t=(r&&((r.url||'')+' '+(r.title||'')))||'',m=t.match(/https?:\/\/\S+/);if(m)openAdd(m[0])}catch(e){}}
window.addEventListener('sendIntentReceived',incoming);incoming();draw();
</script></body></html>
