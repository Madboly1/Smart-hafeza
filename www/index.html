<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حافظة اللينكات</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;background:#0f1115;padding:10px;z-index:5}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#eee;font-size:16px;margin:4px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chip{padding:6px 12px;border-radius:20px;background:#1a1d24;white-space:nowrap;font-size:14px}.chip.on{background:#4f7cff}
.card{display:flex;gap:10px;background:#1a1d24;border-radius:12px;margin:8px 10px;padding:8px}.card img{width:90px;height:68px;object-fit:cover;border-radius:8px;background:#333}
.card h4{margin:0 0 4px;font-size:15px}.meta{font-size:12px;color:#9aa}.bar{height:5px;background:#333;border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:#3ecf8e;border-radius:3px}
.fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:#4f7cff;color:#fff;font-size:30px;border:0}
.btn{padding:10px 14px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:15px;margin:4px 2px}.btn.g{background:#2a2f3a}.btn.r{background:#c0392b}
.sheet{position:fixed;inset:0;background:#0f1115;padding:14px;overflow:auto;z-index:9;display:none}.sheet.on{display:block}
.warn{background:#3a2f12;margin:8px 10px;padding:10px;border-radius:10px;font-size:14px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.rd{background:#1a1d24;border-radius:10px;padding:12px;line-height:1.8;max-height:60vh;overflow:auto;margin:8px 0}.rd img{width:100%;border-radius:8px}
</style></head><body>
<header><input id="q" placeholder="🔍 ابحث في اللينكات..." oninput="draw()"><div class="chips" id="chips"></div></header>
<div id="warn"></div><div id="list"></div><button class="fab" onclick="openAdd()">+</button>
<div class="sheet" id="add"><h3>حفظ لينك</h3><input id="u" placeholder="الصق اللينك هنا" dir="ltr">
<select id="c"></select><button class="btn g" onclick="newCat('c')">+ تصنيف جديد</button><br>
<button class="btn" onclick="save()">حفظ</button><button class="btn g" onclick="closeAll()">إلغاء</button></div>
<div class="sheet" id="det"></div>
<script>
const $=id=>document.getElementById(id),P=window.Capacitor&&Capacitor.Plugins||{};
let D=JSON.parse(localStorage.getItem('hl')||'{"links":[],"cats":["مونتاج","رياضة","أخرى"]}'),cur='الكل',last='أخرى';
const st=()=>localStorage.setItem('hl',JSON.stringify(D)),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt=u=>(u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/)||[])[1];
function kind(u){if(yt(u)||/vimeo|tiktok|\/reel|\/watch|\/videos|fb\.watch/.test(u))return'فيديو';if(/facebook|fb\.com|instagram|twitter|x\.com|threads/.test(u))return'بوست';return'مقال'}
function embed(u){const y=yt(u);if(y)return'https://www.youtube.com/embed/'+y;let m;
if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return'https://www.tiktok.com/embed/v2/'+m[1];
if(/instagram\.com\/(p|reel|tv)\//.test(u))return u.split('?')[0].replace(/\/?$/,'/')+'embed';
if(/facebook\.com|fb\.watch|fb\.com/.test(u))return/\/videos?\/|\/reel|\/watch|fb\.watch/.test(u)?'https://www.facebook.com/plugins/video.php?show_text=true&href='+encodeURIComponent(u):'https://www.facebook.com/plugins/post.php?href='+encodeURIComponent(u);
return''}
async function reader(l){const b=$('rd');try{const h=await(await fetch(l.url)).text(),d=new DOMParser().parseFromString(h,'text/html'),r=d.querySelector('article')||d.body;
const t=[...r.querySelectorAll('h1,h2,h3,p')].map(e=>e.textContent.trim()).filter(s=>s.length>30);
b.innerHTML=(l.img?`<img src="${esc(l.img)}">`:'')+(t.length?t.map(s=>`<p>${esc(s)}</p>`).join(''):'مقدرتش أعرض المحتوى هنا — جرّب "افتح في المتصفح".')}catch(e){b.textContent='مقدرتش أعرض المحتوى هنا — جرّب "افتح في المتصفح".'}}
async function meta(u){try{if(yt(u)){const j=await(await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u))).json();return{title:j.title,img:j.thumbnail_url}}
const h=await(await fetch(u)).text(),g=p=>{const m=h.match(new RegExp('<meta[^>]+(?:property|name)=["\']'+p+'["\'][^>]*content=["\']([^"\']*)','i'));return m&&m[1]};
return{title:g('og:title')||(h.match(/<title>([^<]*)/i)||[])[1],img:g('og:image')}}catch(e){return{}}}
function draw(){const q=$('q').value.toLowerCase();
$('chips').innerHTML=['الكل',...D.cats].map(c=>`<span class="chip ${c==cur?'on':''}" onclick="cur='${c}';draw()">${c}</span>`).join('');
const old=D.links.filter(l=>l.p<100&&Date.now()-l.seen>7*864e5);
$('warn').innerHTML=old.length?`<div class="warn" onclick="show('${old[0].id}')">⏰ عندك ${old.length} لينك مشفتهوش من أكتر من أسبوع — دوس لتفتح أولهم</div>`:'';
$('list').innerHTML=D.links.filter(l=>(cur=='الكل'||l.c==cur)&&(l.title+l.url+l.c).toLowerCase().includes(q)).map(l=>`<div class="card" onclick="show('${l.id}')"><img src="${esc(l.img)}" onerror="this.style.visibility='hidden'"><div style="flex:1"><h4>${esc(l.title||l.url)}</h4><div class="meta">${l.k} • ${esc(l.c)} • ${l.p==100?'✅ خلصت':l.p>0?l.p+'% — '+esc(l.note||''):'لسه'}</div><div class="bar"><i style="width:${l.p}%"></i></div></div></div>`).join('')||'<p style="text-align:center;color:#789">مفيش لينكات — دوس + أو شارك لينك من أي تطبيق</p>'}
function fillCats(){$('c').innerHTML=D.cats.map(c=>`<option ${c==last?'selected':''}>${c}</option>`).join('')}
function openAdd(u){fillCats();$('u').value=u||'';$('add').classList.add('on')}
function closeAll(){$('add').classList.remove('on');$('det').classList.remove('on');$('det').innerHTML=''}
function newCat(sel){const n=prompt('اسم التصنيف الجديد:');if(n&&!D.cats.includes(n)){D.cats.push(n);st()}if(sel=='c'){last=n||last;fillCats()}draw()}
async function save(){const u=$('u').value.trim();if(!u)return;last=$('c').value;const m=await meta(u);
D.links.unshift({id:''+Date.now(),url:u,k:kind(u),c:last,title:m.title||'',img:m.img||(yt(u)?`https://i.ytimg.com/vi/${yt(u)}/hqdefault.jpg`:''),p:0,note:'',seen:Date.now()});st();closeAll();draw()}
function show(id){const l=D.links.find(x=>x.id==id);l.seen=Date.now();st();const e=embed(l.url);
$('det').innerHTML=`<button class="btn g" onclick="closeAll();draw()">← رجوع</button><h3>${esc(l.title||l.url)}</h3>
${e?`<iframe src="${e}" style="${yt(l.url)?'':'aspect-ratio:auto;height:70vh'}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`:'<div id="rd" class="rd">⏳ جاري تحميل المحتوى...</div>'}
<button class="btn g" onclick="openIn('${l.id}')">🌐 افتح في المتصفح</button>
<p>التقدم: <b id="pv">${l.p}</b>%</p><input type="range" min="0" max="100" step="5" value="${l.p}" oninput="$('pv').textContent=this.value;upd('${l.id}','p',+this.value)">
<button class="btn g" onclick="setP('${l.id}',0)">لسه</button><button class="btn g" onclick="setP('${l.id}',50)">نص</button><button class="btn g" onclick="setP('${l.id}',100)">خلصت ✅</button>
<input placeholder="وقفت عند... (مثلاً دقيقة 12)" value="${esc(l.note)}" onchange="upd('${l.id}','note',this.value)">
<select onchange="upd('${l.id}','c',this.value)">${D.cats.map(c=>`<option ${c==l.c?'selected':''}>${c}</option>`).join('')}</select>
<button class="btn r" onclick="if(confirm('تمسح اللينك؟')){D.links=D.links.filter(x=>x.id!='${l.id}');st();closeAll();draw()}">🗑 مسح</button>`;
$('det').classList.add('on');if(!e)reader(l)}
function upd(id,k,v){D.links.find(x=>x.id==id)[k]=v;st()}
function setP(id,v){upd(id,'p',v);$('pv').textContent=v;document.querySelector('#det input[type=range]').value=v}
function openIn(id){const l=D.links.find(x=>x.id==id);P.Browser?P.Browser.open({url:l.url}):window.open(l.url)}
async function incoming(){try{const r=await P.SendIntent.checkSendIntentReceived();const t=(r&&((r.url||'')+' '+(r.title||'')))||'';const m=t.match(/https?:\/\/\S+/);if(m)openAdd(m[0])}catch(e){}}
window.addEventListener('sendIntentReceived',incoming);incoming();draw();
</script></body></html>
