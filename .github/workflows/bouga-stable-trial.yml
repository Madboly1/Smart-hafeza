name: BOUGA stable signed trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-trial:
    if: github.ref == 'refs/heads/migration/flutter-foundation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout selected trial branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref }}

      - name: Fail closed when signing secrets are unavailable
        shell: bash
        env:
          BOUGA_KEYSTORE_BASE64: \${{ secrets.BOUGA_KEYSTORE_BASE64 }}
          BOUGA_SIGNING_PASSWORD: \${{ secrets.BOUGA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$BOUGA_KEYSTORE_BASE64" || -z "$BOUGA_SIGNING_PASSWORD" ]]; then
            echo "Required BOUGA trial signing secrets are not configured." >&2
            exit 1
          fi

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --platforms=android --org com.hafeza --project-name bouga .

      - name: Generate existing launcher icon
        run: dart run flutter_launcher_icons

      - name: Configure Android compile SDK 36 and trial-only identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/app/build.gradle.kts ]]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/applicationId = "com.hafeza.bouga"/applicationId = "com.hafeza.links.trial"/' android/app/build.gradle.kts
            grep -q 'compileSdk = 36' android/app/build.gradle.kts
            grep -q 'applicationId = "com.hafeza.links.trial"' android/app/build.gradle.kts
            if grep -Fq 'applicationId = "com.hafeza.links"' android/app/build.gradle.kts; then
              echo "Production Android identity detected; refusing to build." >&2
              exit 1
            fi
          elif [[ -f android/app/build.gradle ]]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i "s/applicationId 'com.hafeza.bouga'/applicationId 'com.hafeza.links.trial'/" android/app/build.gradle
            grep -q 'compileSdkVersion 36' android/app/build.gradle
            grep -q "applicationId 'com.hafeza.links.trial'" android/app/build.gradle
            if grep -Fq "applicationId 'com.hafeza.links'" android/app/build.gradle; then
              echo "Production Android identity detected; refusing to build." >&2
              exit 1
            fi
          else
            echo "Generated Android app Gradle file not found" >&2
            exit 1
          fi

          test -f android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="bouga"/android:label="بؤجة تجريبي"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="بؤجة تجريبي"' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Reconstruct encrypted trial keystore in runner temp
        shell: bash
        env:
          BOUGA_KEYSTORE_BASE64: \${{ secrets.BOUGA_KEYSTORE_BASE64 }}
          BOUGA_SIGNING_PASSWORD: \${{ secrets.BOUGA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/bouga-trial-signing.p12"
          printf '%s' "$BOUGA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          openssl pkcs12 -in "$KEYSTORE_PATH" -passin env:BOUGA_SIGNING_PASSWORD -noout
          printf 'BOUGA_KEYSTORE_PATH=%s\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Configure mandatory trial release signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${BOUGA_KEYSTORE_PATH:-}"
          test -s "$BOUGA_KEYSTORE_PATH"
          if [[ -f android/app/build.gradle.kts ]]; then
            cat >> android/app/build.gradle.kts <<'GRADLE'

          // BOUGA isolated trial signing: never use the generated debug key.
          val bougaTrialKeystorePath = System.getenv("BOUGA_KEYSTORE_PATH")
              ?: error("BOUGA_KEYSTORE_PATH is required")
          val bougaTrialSigningPassword = System.getenv("BOUGA_SIGNING_PASSWORD")
              ?: error("BOUGA_SIGNING_PASSWORD is required")
          android {
              signingConfigs {
                  create("bougaTrialRelease") {
                      storeFile = file(bougaTrialKeystorePath)
                      storePassword = bougaTrialSigningPassword
                      keyAlias = "bouga"
                      keyPassword = bougaTrialSigningPassword
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("bougaTrialRelease")
                  }
              }
          }
          GRADLE
          elif [[ -f android/app/build.gradle ]]; then
            cat >> android/app/build.gradle <<'GRADLE'

          // BOUGA isolated trial signing: never use the generated debug key.
          def bougaTrialKeystorePath = System.getenv("BOUGA_KEYSTORE_PATH")
          def bougaTrialSigningPassword = System.getenv("BOUGA_SIGNING_PASSWORD")
          if (!bougaTrialKeystorePath || !bougaTrialSigningPassword) {
              throw new GradleException("BOUGA trial signing environment is required")
          }
          android {
              signingConfigs {
                  bougaTrialRelease {
                      storeFile file(bougaTrialKeystorePath)
                      storePassword bougaTrialSigningPassword
                      keyAlias "bouga"
                      keyPassword bougaTrialSigningPassword
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.bougaTrialRelease
                  }
              }
          }
          GRADLE
          else
            echo "Generated Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Build signed split-per-ABI trial release APKs
        shell: bash
        env:
          BOUGA_SIGNING_PASSWORD: \${{ secrets.BOUGA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "\${BOUGA_KEYSTORE_PATH:-}"
          test -s "$BOUGA_KEYSTORE_PATH"
          test -n "$BOUGA_SIGNING_PASSWORD"
          BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --split-per-abi --build-number "$BUILD_NUMBER"
          compgen -G "build/app/outputs/flutter-apk/app-*-release.apk" >/dev/null

      - name: Upload only trial release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bouga-stable-trial-apks
          path: flutter/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Remove reconstructed signing file
        if: always()
        shell: bash
        run: |
          if [[ -n "\${BOUGA_KEYSTORE_PATH:-}" ]]; then
            rm -f "$BOUGA_KEYSTORE_PATH"
          fi
