name: BOUGA Flutter foundation
on:
  push:
    branches: [migration/flutter-foundation]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  pull_request:
    branches: [migration/flutter-foundation]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:
    inputs:
      trial:
        description: "Build with the BOUGA trial identity"
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=android,windows,web --org com.hafeza --project-name bouga .
      - name: Configure Android compile SDK
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            grep -q 'compileSdk = 36' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            grep -q 'compileSdkVersion 36' android/app/build.gradle
          else
            echo "Generated Android app Gradle file not found" >&2
            exit 1
          fi
      - name: Set production Android identity
        if: inputs.trial != true
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.hafeza.bouga"/applicationId = "com.hafeza.links"/' android/app/build.gradle.kts
            grep -q 'applicationId = "com.hafeza.links"' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId 'com.hafeza.bouga'/applicationId 'com.hafeza.links'/" android/app/build.gradle
            grep -q "applicationId 'com.hafeza.links'" android/app/build.gradle
          else
            echo "Generated Android app Gradle file not found" >&2
            exit 1
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="bouga"/android:label="بؤجة"/' android/app/src/main/AndroidManifest.xml
            grep -q 'android:label="بؤجة"' android/app/src/main/AndroidManifest.xml
          else
            echo "Generated AndroidManifest.xml not found" >&2
            exit 1
          fi
      - name: Set trial Android identity
        if: inputs.trial == true
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.hafeza.bouga"/applicationId = "com.hafeza.links.trial"/' android/app/build.gradle.kts
            grep -q 'applicationId = "com.hafeza.links.trial"' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId 'com.hafeza.bouga'/applicationId 'com.hafeza.links.trial'/" android/app/build.gradle
            grep -q "applicationId 'com.hafeza.links.trial'" android/app/build.gradle
          else
            echo "Generated Android app Gradle file not found" >&2
            exit 1
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="bouga"/android:label="بؤجة تجريبي"/' android/app/src/main/AndroidManifest.xml
            grep -q 'android:label="بؤجة تجريبي"' android/app/src/main/AndroidManifest.xml
          else
            echo "Generated AndroidManifest.xml not found" >&2
            exit 1
          fi
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APKs
        run: flutter build apk --debug --split-per-abi
      - name: Build Android release APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bouga-apks
          path: flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
